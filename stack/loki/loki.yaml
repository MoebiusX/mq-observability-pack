# Loki 3.x single-binary, filesystem storage, OTLP ingestion enabled (default in 3.x).
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info                  # /ready takes ~4-5 min after start on this config; keep the lifecycle visible

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-04-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  volume_enabled: true
  retention_period: 48h
  otlp_config:
    resource_attributes:
      attributes_config:
        - action: index_label
          attributes: [ service.name, service.namespace, deployment.environment, mq.qmgr.name ]

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

ruler:
  alertmanager_url: http://alertmanager:9093

analytics:
  reporting_enabled: false
