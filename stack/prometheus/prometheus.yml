# Prometheus for the MQ lab. All application metrics arrive via remote-write
# from the OTel Collector; Prometheus only scrapes itself and Alertmanager.
global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    lab: mq-obs

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [ "alertmanager:9093" ]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [ "127.0.0.1:9090" ]
  - job_name: alertmanager
    static_configs:
      - targets: [ "alertmanager:9093" ]
