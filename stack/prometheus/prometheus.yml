# Prometheus for the MQ lab. All application metrics arrive via remote-write
# from the OTel Collector; Prometheus scrapes only itself and the platform's own components
# (Alertmanager, Grafana, Loki, Tempo) and the lab's Kafka node.
global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    lab: mq-obs
    environment: lab

rule_files:
  - /etc/prometheus/rules/*.yml
  # Observogram reference packs (grafana, prometheus), materialised by tools/reference-packs.mjs
  # for live validation of their rules and boards against this lab; not part of the MQ pack.
  - /etc/prometheus/rules-reference/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [ "alertmanager:9093" ]

tracing:
  endpoint: otel-collector:4317
  insecure: true
  sampling_fraction: 0.25

scrape_configs:
  # prometheus-self: the job name Observogram's prometheus reference pack declares for a Prometheus
  # scraping itself (its pipelines panels select on it); nothing in the MQ pack reads this job.
  - job_name: prometheus-self
    static_configs:
      - targets: [ "127.0.0.1:9090" ]
  - job_name: alertmanager
    static_configs:
      - targets: [ "alertmanager:9093" ]
  - job_name: grafana
    static_configs:
      - targets: [ "grafana:3000" ]
  - job_name: loki
    static_configs:
      - targets: [ "loki:3100" ]
  - job_name: tempo
    static_configs:
      - targets: [ "tempo:3200" ]
  # Observogram's kafka reference pack: the lab's single Kafka node (broker MBeans through the JMX
  # exporter javaagent, topics and consumer groups through kafka_exporter); the job names are the
  # ones the pack's SLIs select on. Not part of the MQ pack.
  - job_name: kafka-broker
    static_configs:
      - targets: [ "kafka:9404" ]
        labels: { service: kafka }
  - job_name: kafka-exporter
    static_configs:
      - targets: [ "kafka-exporter:9308" ]
        labels: { service: kafka }
