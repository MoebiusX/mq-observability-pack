# Prometheus for the MQ lab. All application metrics arrive via remote-write
# from the OTel Collector; Prometheus scrapes only itself and the platform's own components
# (Alertmanager, Grafana, Loki, Tempo).
global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    lab: mq-obs
    environment: lab

rule_files:
  - /etc/prometheus/rules/*.yml
  # Observogram reference packs (grafana, prometheus), materialised by tools/reference-packs.mjs
  # for live validation of their rules and boards against this lab; not part of the MQ pack.
  - /etc/prometheus/rules-reference/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [ "alertmanager:9093" ]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [ "127.0.0.1:9090" ]
  - job_name: alertmanager
    static_configs:
      - targets: [ "alertmanager:9093" ]
  - job_name: grafana
    static_configs:
      - targets: [ "grafana:3000" ]
  - job_name: loki
    static_configs:
      - targets: [ "loki:3100" ]
  - job_name: tempo
    static_configs:
      - targets: [ "tempo:3200" ]
