# Recording rules of Observogram's grafana reference pack (grafana 1.0.0), materialised by
# tools/reference-packs.mjs from https://github.com/MoebiusX/Observogram.git codex/refpacks-live-names (3814a79) reference-packs/grafana.pack.yaml
# spec.queries.recording_rules: ref:slis.<id> expanded to the SLI query, or (good) / (total) for a
# ratio SLI. For live validation of the pack against this lab only; not part of the MQ pack. Do not
# edit: rerun the tool. Skipped (the policy generates them with labels): grafana:errorbudget:burn_1h.
groups:
  - name: grafana.reference.recording.30s
    interval: 30s
    rules:
      - record: grafana:http_request_success:ratio_5m
        expr: (sum(rate(grafana_http_request_duration_seconds_count{status_code!~"5.."}[5m]))) / (sum(rate(grafana_http_request_duration_seconds_count[5m])))
      - record: grafana:http_request_success:error_ratio_5m
        expr: 1 - grafana:http_request_success:ratio_5m
      - record: grafana:http_request:p99_5m
        expr: |
          histogram_quantile(0.99,
            sum by (le)(rate(grafana_http_request_duration_seconds_bucket[5m])))
      - record: grafana:datasource_proxy:ratio_5m
        expr: (sum(rate(grafana_datasource_request_total{code!~"5.."}[5m]))) / (sum(rate(grafana_datasource_request_total[5m])))
      - record: grafana:datasource_proxy:error_ratio_5m
        expr: 1 - grafana:datasource_proxy:ratio_5m
      - record: grafana:datasource_proxy:p99_5m
        expr: |
          histogram_quantile(0.99,
            sum by (le)(rate(grafana_datasource_request_duration_seconds_bucket[5m])))
      - record: grafana:database_query:p99_5m
        expr: |
          histogram_quantile(0.99,
            sum by (le)(rate(grafana_database_queries_duration_seconds_bucket[5m])))
      - record: grafana:alerting_evaluation:ratio_5m
        expr: |
          (sum(rate(grafana_alerting_rule_evaluations_total[5m])) -
            (sum(rate(grafana_alerting_rule_evaluation_failures_total[5m])) or vector(0))) / (sum(rate(grafana_alerting_rule_evaluations_total[5m])))
      - record: grafana:alerting_evaluation:error_ratio_5m
        expr: 1 - grafana:alerting_evaluation:ratio_5m
      - record: grafana:plugin_request:ratio_5m
        expr: (sum(rate(grafana_plugin_request_total{status="ok"}[5m]))) / (sum(rate(grafana_plugin_request_total[5m])))
      - record: grafana:login_success:ratio_5m
        expr: (sum(rate(grafana_http_request_duration_seconds_count{handler="/login",method="POST",status_code="200"}[5m]))) / (sum(rate(grafana_http_request_duration_seconds_count{handler="/login",method="POST"}[5m]) > 0))
