# Recording rules of Observogram's kafka reference pack (kafka 1.0.0), materialised by
# tools/reference-packs.mjs from https://github.com/MoebiusX/Observogram.git origin/develop (54223dd) reference-packs/kafka.pack.yaml
# spec.queries.recording_rules: ref:slis.<id> expanded to the SLI query, or (good) / (total) for a
# ratio SLI. For live validation of the pack against this lab only; not part of the MQ pack. Do not
# edit: rerun the tool.
groups:
  - name: kafka.reference.recording.30s
    interval: 30s
    rules:
      - record: kafka:broker_availability:ratio_5m
        expr: (sum(up{job="kafka-broker"} == 1)) / (count(up{job="kafka-broker"}))
      - record: kafka:broker_availability:error_ratio_5m
        expr: 1 - kafka:broker_availability:ratio_5m
      - record: kafka:partition_health:ratio_5m
        expr: (sum(kafka_topic_partition_in_sync_replica == kafka_topic_partition_replicas)) / (count(kafka_topic_partition_replicas))
      - record: kafka:partition_health:error_ratio_5m
        expr: 1 - kafka:partition_health:ratio_5m
      - record: kafka:consumer_lag:seconds_max_5m
        expr: |
          max by (consumergroup) (
            kafka_consumergroup_lag /
              (rate(kafka_consumergroup_current_offset[5m]) > 0)
          )
      - record: kafka:produce_latency:p99_5m
        expr: |
          histogram_quantile(0.99,
            sum by (le)(
              rate(kafka_server_RequestMetrics_localtime_ms_bucket{request="Produce"}[5m])
            ))
      - record: kafka:fetch_latency:p99_5m
        expr: |
          histogram_quantile(0.99,
            sum by (le)(
              rate(kafka_server_RequestMetrics_localtime_ms_bucket{request="FetchConsumer"}[5m])
            ))
  - name: kafka.reference.recording.1m
    interval: 1m
    rules:
      - record: kafka:controller_elections:rate_1h
        expr: sum(rate(kafka_controller_ControllerStats_election_rate[1h])) * 3600
