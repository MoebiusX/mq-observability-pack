# Inventory of environment lab, GENERATED by gen-site from the site inventory: one series per
# queue manager the site says exists. Dashboards and the certification harness read it to list
# the fleet; a single-vantage site alerts when an inventoried queue manager has no telemetry.
groups:
  - name: ibmmq.inventory
    interval: 10s
    rules:
      - record: ibmmq:inventory:qmgr
        expr: vector(1)
        labels: { qmgr: QM1, environment: lab, site: lab, shape: container, vantage: dual }
