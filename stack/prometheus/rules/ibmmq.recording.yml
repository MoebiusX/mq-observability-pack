# Recording rules — one per SLI in packs/ibmmq.pack.yaml (spec.queries.recording_rules).
# Names follow <service>:<sli>:<agg>_<window>. The certification harness asserts every
# rule here is loaded by Prometheus AND currently yields at least one sample.
groups:
  - name: ibmmq.sli
    interval: 10s
    rules:
      # --- availability: process (native endpoint) vs reachability (client exporter) ---
      - record: ibmmq:qmgr_process_up:ratio_5m
        expr: |
          sum(avg_over_time(up{job="ibmmq-native"}[5m]))
            / count(up{job="ibmmq-native"})
      - record: ibmmq:qmgr_process_up:error_ratio_5m
        expr: 1 - ibmmq:qmgr_process_up:ratio_5m

      - record: ibmmq:qmgr_reachability:ratio_5m
        expr: |
          sum(avg_over_time((ibmmq_qmgr_status{job="ibmmq-exporter"} == bool 2)[5m:10s]))
            / count(ibmmq_qmgr_status{job="ibmmq-exporter"})
      - record: ibmmq:qmgr_reachability:error_ratio_5m
        expr: 1 - ibmmq:qmgr_reachability:ratio_5m

      # --- queue health ---
      - record: ibmmq:queue_depth_headroom:ratio
        expr: |
          max by (qmgr, queue) (
            ibmmq_queue_depth{job="ibmmq-exporter", queue=~"APP.*"}
              / ibmmq_queue_attribute_max_depth{job="ibmmq-exporter", queue=~"APP.*"}
          )
      - record: ibmmq:oldest_message_age:seconds_max
        expr: |
          max by (qmgr, queue) (
            ibmmq_queue_oldest_message_age{job="ibmmq-exporter", queue=~"APP.*", queue!="APP.DLQ"}
          )
      - record: ibmmq:dlq_depth:max
        expr: max by (qmgr) (ibmmq_queue_depth{job="ibmmq-exporter", queue="APP.DLQ"})

      # --- synthetic canary (OTel SDK → collector → remote-write) ---
      - record: ibmmq:canary_success:ratio_5m
        expr: |
          sum(rate(mq_canary_attempts_total{result="ok"}[5m]))
            / sum(rate(mq_canary_attempts_total[5m]))
      - record: ibmmq:canary_success:error_ratio_5m
        expr: 1 - ibmmq:canary_success:ratio_5m
      - record: ibmmq:canary_roundtrip:p99_5m
        expr: |
          histogram_quantile(0.99,
            sum by (le) (rate(mq_canary_roundtrip_duration_seconds_bucket[5m])))

      # --- queue manager internals ---
      - record: ibmmq:log_write_latency:seconds
        expr: max by (qmgr) (ibmmq_qmgr_log_write_latency_seconds{job="ibmmq-exporter"})

  - name: ibmmq.errorbudget
    interval: 30s
    rules:
      # SLO qmgr_process_up_99_9 (objective 0.999) — burn = error_ratio / (1 - objective)
      - record: ibmmq:errorbudget:burn_5m
        labels: { slo: qmgr_process_up_99_9 }
        expr: ibmmq:qmgr_process_up:error_ratio_5m / (1 - 0.999)
      - record: ibmmq:errorbudget:burn_1h
        labels: { slo: qmgr_process_up_99_9 }
        expr: (1 - (sum(avg_over_time(up{job="ibmmq-native"}[1h])) / count(up{job="ibmmq-native"}))) / (1 - 0.999)
      # SLO canary_success_99_9
      - record: ibmmq:errorbudget:burn_5m
        labels: { slo: canary_success_99_9 }
        expr: ibmmq:canary_success:error_ratio_5m / (1 - 0.999)
      - record: ibmmq:errorbudget:burn_1h
        labels: { slo: canary_success_99_9 }
        expr: (1 - (sum(rate(mq_canary_attempts_total{result="ok"}[1h])) / sum(rate(mq_canary_attempts_total[1h])))) / (1 - 0.999)
