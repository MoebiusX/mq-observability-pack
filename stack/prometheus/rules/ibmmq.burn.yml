          slo_window: 7d
      - alert: log_latency_99_under_20ms_burn_3x_1h_6h
        expr: |
          (
            (sum_over_time((max(ibmmq:log_write_latency:seconds) > bool 0.02)[1h:10s]) / 360) > 0.03
          ) and (
            (sum_over_time((max(ibmmq:log_write_latency:seconds) > bool 0.02)[6h:10s]) / 2160) > 0.03
          ) and (
            sum_over_time((max(ibmmq:log_write_latency:seconds) > bool 0.02)[1h:10s]) >= 2
          )
        for: 5m
        labels:
          severity: SEV3
          pack: ibmmq
          slo: log_latency_99_under_20ms
          sli: log_write_latency
          service: ibmmq
          burn_rate: "3"
          window_short: 1h
          window_long: 6h
        annotations:
          summary: "Burn rate 3x on log_latency_99_under_20ms"
          description: "Both the 1h and 6h error ratios exceed 3x of the 1% error budget for log_latency_99_under_20ms (objective 99% over 7d), with at least 2 bad samples in the 1h window."
          slo_objective: 99%
          slo_window: 7d
