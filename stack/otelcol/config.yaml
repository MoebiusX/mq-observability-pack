# OpenTelemetry Collector (contrib 0.161.x) — single collector for the MQ lab.
#
#  metrics : prometheus receiver scrapes (a) the queue manager's native /metrics,
#            (b) mq_prometheus, (c) itself  → remote-write into Prometheus
#  logs    : filelog tails docker json logs; MQ's JSON console log is parsed into
#            attributes (ibm_messageId, ibm_serverName, loglevel) → Loki via OTLP
#  traces  : OTLP from canary/producer/consumer → Jaeger v2 via OTLP
#  metrics : OTLP from the canary (round-trip histogram, attempt counters) → Prometheus

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  file_storage:
    directory: /var/lib/otelcol
    create_directory: true

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  prometheus:
    config:
      global:
        scrape_interval: 10s
        scrape_timeout: 8s
      scrape_configs:
        - job_name: ibmmq-native            # qmgr process itself — survives listener faults
          static_configs:
            - targets: [ "mq:9157" ]
              labels: { qmgr: "${env:MQ_QMGR_NAME}", source: native }
        - job_name: ibmmq-exporter          # mq_prometheus as an MQ client — sees what apps see
          static_configs:
            - targets: [ "mq-exporter:9157" ]
              labels: { source: exporter }
        - job_name: otel-collector
          static_configs:
            - targets: [ "127.0.0.1:8888" ]

  filelog:
    include: [ /var/lib/docker/containers/*/*-json.log ]
    start_at: end
    storage: file_storage
    include_file_path: true
    operators:
      # docker json-file driver envelope
      - type: json_parser
        id: docker_envelope
        timestamp:
          parse_from: attributes.time
          layout: '%Y-%m-%dT%H:%M:%S.%LZ'
      - type: regex_parser
        id: container_id
        parse_from: attributes["log.file.path"]
        regex: '^/var/lib/docker/containers/(?P<container_id>[0-9a-f]+)/'
      - type: move
        from: attributes.log
        to: body
      - type: remove
        field: attributes.time
      # IBM MQ console JSON (MQ_LOGGING_CONSOLE_FORMAT=json)
      - type: json_parser
        id: mq_json
        if: 'body matches "^\\{.*\"ibm_messageId\""'
        parse_from: body
        parse_to: attributes.mq
        severity:
          parse_from: attributes.mq.loglevel
          mapping:
            info: INFO
            warn: WARNING
            error: ERROR
            fatal: FATAL

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100

  batch:
    timeout: 2s
    send_batch_size: 512

  resource:
    attributes:
      - { key: deployment.environment, value: "${env:ENV}", action: upsert }
      - { key: mq.qmgr.name,           value: "${env:MQ_QMGR_NAME}", action: upsert }

  # Promote MQ log fields to resource/service identity so Loki labels them sensibly.
  transform/mqlogs:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - set(resource.attributes["service.name"], "docker") where resource.attributes["service.name"] == nil
          - set(resource.attributes["service.namespace"], "ibmmq") where resource.attributes["service.namespace"] == nil
          - set(resource.attributes["service.name"], "ibmmq") where attributes["mq"]["ibm_messageId"] != nil
          - set(attributes["mq.qmgr.name"], attributes["mq"]["ibm_serverName"]) where attributes["mq"]["ibm_serverName"] != nil
          - set(attributes["mq.message_id"], attributes["mq"]["ibm_messageId"]) where attributes["mq"]["ibm_messageId"] != nil
          - set(attributes["mq.process"], attributes["mq"]["ibm_processName"]) where attributes["mq"]["ibm_processName"] != nil
          - set(body, attributes["mq"]["message"]) where attributes["mq"]["message"] != nil
          - delete_key(attributes, "mq")

exporters:
  debug:
    verbosity: basic

  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
    tls:
      insecure: true
    resource_to_telemetry_conversion:
      enabled: false
    add_metric_suffixes: true

  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

service:
  extensions: [ health_check, file_storage ]
  telemetry:
    logs:
      level: info
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    metrics:
      receivers: [ prometheus, otlp ]
      processors: [ memory_limiter, resource, batch ]
      exporters: [ prometheusremotewrite ]
    logs:
      receivers: [ filelog, otlp ]
      processors: [ memory_limiter, resource, transform/mqlogs, batch ]
      exporters: [ otlphttp/loki ]
    traces:
      receivers: [ otlp ]
      processors: [ memory_limiter, resource, batch ]
      exporters: [ otlp/jaeger ]
