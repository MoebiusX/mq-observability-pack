# mq-observability-pack — self-contained IBM MQ observability lab.
#
#   docker compose up -d --build --wait      # bring up MQ + telemetry stack + canary
#   npm run certify                          # conformance + synthetic + chaos → reports/
#   docker compose down -v                   # tear down incl. volumes
#
# Every host port is bound to loopback. Port block: 127.0.0.1:2xxxx so it never
# collides with Observogram's validation stacks (13xxx / 1xxxx).
#
# Two MQ metric sources on purpose:
#   * the queue manager's NATIVE endpoint (mq:9157, MQ_ENABLE_METRICS=true) — qmgr-level only,
#     survives listener/channel faults → tells "process alive"
#   * mq_prometheus (ibm-messaging/mq-metric-samples) as an MQ CLIENT — queue/channel level,
#     dies with the listener/SVRCONN → tells "reachable by applications"
#   The difference between the two is the differential diagnosis the pack alerts on.

name: mq-obs

x-loki-otlp: &loki_otlp http://loki:3100/otlp

# Every service: come back after a daemon restart or a crash (chaos uses explicit
# 'compose stop', which unless-stopped honours), json-file logging with the compose labels
# in each line's envelope (the collector keeps only project=mq-obs lines and names the
# service from the label), and rotation so a chatty container cannot fill the disk.
x-service: &lab_service
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      labels: "com.docker.compose.project,com.docker.compose.service"
      max-size: "20m"
      max-file: "3"

services:

  # ---------------------------------------------------------------- IBM MQ
  mq:
    <<: *lab_service
    image: icr.io/ibm-messaging/mq:${MQ_IMAGE_TAG:-10.0.0.5-r1}
    hostname: mq
    environment:
      LICENSE: accept
      MQ_QMGR_NAME: ${MQ_QMGR_NAME:-QM1}
      MQ_ENABLE_METRICS: "true"
      MQ_LOGGING_CONSOLE_FORMAT: json
      MQ_LOGGING_CONSOLE_SOURCE: qmgr,web
      MQ_ENABLE_EMBEDDED_WEB_SERVER: "true"
      # Deprecated since 9.4 but still honoured on 9.4.x; 10.0 prefers the secrets below.
      MQ_ADMIN_PASSWORD: ${MQ_ADMIN_PASSWORD:-passw0rd}
      MQ_APP_PASSWORD: ${MQ_APP_PASSWORD:-passw0rd}
    secrets:
      - mqAdminPassword
      - mqAppPassword
    ports:
      - "127.0.0.1:21414:1414"   # MQ listener
      - "127.0.0.1:29443:9443"   # web console / REST (https, admin / passw0rd)
      - "127.0.0.1:29157:9157"   # native qmgr metrics
    volumes:
      - qmdata:/mnt/mqm
      - ./stack/mq/20-observability.mqsc:/etc/mqm/20-observability.mqsc:ro
    ulimits:
      nofile: { soft: 10240, hard: 10240 }
    healthcheck:
      test: ["CMD", "chkmqready"]   # readiness (qmgr RUNNING + listener up), not just liveness (chkmqhealthy)
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  # ------------------------------------------------- mq_prometheus exporter
  # Built from IBM source at a pinned tag (v6.0.0, Jun 2026): stack/mq-exporter/Dockerfile
  # clones the tag inside its builder stage. A remote git build context here breaks
  # buildx bake on Windows (see that Dockerfile's header), so the context is local.
  # Connects as an MQ client over DEV.ADMIN.SVRCONN so it sees exactly what
  # an application sees: if the listener is down, so is this exporter.
  mq-exporter:
    <<: *lab_service
    build:
      context: ./stack/mq-exporter
      args:
        EXPORTER: mq_prometheus
        MQ_METRIC_SAMPLES_TAG: v6.0.0
    image: mq-obs/mq_prometheus:v6.0.0
    environment:
      IBMMQ_CONNECTION_QUEUEMANAGER: ${MQ_QMGR_NAME:-QM1}
      IBMMQ_CONNECTION_USER: admin
      IBMMQ_CONNECTION_PASSWORDFILE: /run/secrets/mqAdminPassword
      IBMMQ_GLOBAL_LOGLEVEL: INFO
    secrets:
      - mqAdminPassword
    volumes:
      - ./stack/mq-exporter/mq_prometheus.yaml:/opt/config/mq_prometheus.yaml:ro
    ports:
      - "127.0.0.1:29158:9157"
    depends_on:
      mq:
        condition: service_healthy

  # -------------------------------------------------------- OTel Collector
  otel-collector:
    <<: *lab_service
    image: otel/opentelemetry-collector-contrib:${OTELCOL_TAG:-0.161.0}
    command: ["--config=/etc/otelcol/config.yaml"]
    user: "0"                     # needs to read docker json logs
    environment:
      ENV: ${ENV:-lab}
      MQ_QMGR_NAME: ${MQ_QMGR_NAME:-QM1}
    volumes:
      - ./stack/otelcol/config.yaml:/etc/otelcol/config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - otelcol-state:/var/lib/otelcol
    ports:
      - "127.0.0.1:24317:4317"   # OTLP gRPC
      - "127.0.0.1:24318:4318"   # OTLP HTTP
      - "127.0.0.1:28888:8888"   # collector self-metrics
      - "127.0.0.1:23133:13133"  # health_check
    depends_on:
      # Scrape mq:9157 only once the queue manager is ready: otherwise a fresh start records
      # a minute of up{job="ibmmq-native"}=0 that burns the 1h error budget and fires the
      # availability burn-rate alert on a healthy stack.
      mq:
        condition: service_healthy
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "--version"]   # scratch-ish image; liveness only
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------ Prometheus
  prometheus:
    <<: *lab_service
    image: prom/prometheus:${PROM_TAG:-v3.14.0}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
    volumes:
      - ./stack/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./stack/prometheus/rules:/etc/prometheus/rules:ro
      # Observogram reference packs (grafana, prometheus) materialised for live validation
      # (tools/reference-packs.mjs); a separate directory so check-rules sees only the MQ rules.
      - ./stack/prometheus/rules-reference:/etc/prometheus/rules-reference:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:29090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 3s
      timeout: 2s
      retries: 30

  alertmanager:
    <<: *lab_service
    image: prom/alertmanager:${AM_TAG:-v0.34.0}
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./stack/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:29093:9093"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9093/-/ready"]
      interval: 3s
      timeout: 2s
      retries: 30

  # Receives Alertmanager webhooks and keeps a timestamped ledger the harness
  # reads back to compute MTTD (alert fired − fault injected).
  alert-sink:
    <<: *lab_service
    build: ./harness/alert-sink
    image: mq-obs/alert-sink:local
    ports:
      - "127.0.0.1:29095:9095"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9095/healthz"]
      interval: 3s
      timeout: 2s
      retries: 20

  # ------------------------------------------------------------------ Loki
  loki:
    <<: *lab_service
    image: grafana/loki:${LOKI_TAG:-3.7.7}
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./stack/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - lokidata:/loki
    ports:
      - "127.0.0.1:23100:3100"
    # No compose healthcheck: grafana/loki 3.x is a distroless image (no sh, wget or curl
    # to exec, so any CMD probe fails and the service is reported unhealthy forever).
    # Readiness is probed by the harness (C1 → /ready); Loki needs ~5 min to answer /ready on
    # this single-binary config (measured; ~1 min when its volume already has data). C1 waits 6 min.

  # ----------------------------------------------------------------- Tempo
  # Grafana Tempo is the lab's trace store (and the pack's declared production one).
  # Jaeger 2.21 was tried first: that release removed the v1 HTTP query API and Grafana
  # 12.4's Jaeger datasource speaks only v1, so Explore and log→trace links were dead.
  tempo:
    <<: *lab_service
    image: grafana/tempo:${TEMPO_TAG:-2.10.1}
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./stack/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempodata:/var/tempo
    ports:
      - "127.0.0.1:23200:3200"   # HTTP API: /ready, /api/search (TraceQL), /api/v2/traces/<id>
    # No compose healthcheck: distroless image (no sh/wget). Harness C1 probes /ready.

  # --------------------------------------------------------------- Grafana
  grafana:
    <<: *lab_service
    image: grafana/grafana:${GRAFANA_TAG:-12.4.11}
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_FEATURE_TOGGLES_ENABLE: traceToMetrics
      # Loopback-only lab: boards open (and screenshot) without a login; the admin user stays.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # What Observogram's grafana reference pack reads and Grafana does not emit by default:
      # the database query histogram (its database SLI) and Grafana's own traces to Tempo
      # through the collector (its "Recent traces" panel).
      GF_DATABASE_INSTRUMENT_QUERIES: "true"
      GF_TRACING_OPENTELEMETRY_OTLP_ADDRESS: otel-collector:4317
      GF_TRACING_OPENTELEMETRY_OTLP_PROPAGATION: w3c
    volumes:
      - ./stack/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./stack/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana   # the imported reference-pack boards survive a recreate
    ports:
      - "127.0.0.1:23000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 3s
      timeout: 2s
      retries: 45

  # The grafana reference pack's login SLI needs form logins; nothing else in the lab makes any
  # (basic auth counts as an authentication, not a login). One POST /login every 5 minutes.
  grafana-login-canary:
    <<: *lab_service
    image: curlimages/curl:${CURL_TAG:-8.22.0}
    entrypoint: ["/bin/sh", "/canary/login-canary.sh"]
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_USER: admin
      GRAFANA_PASSWORD: admin
      LOGIN_INTERVAL: "300"
    volumes:
      - ./stack/grafana/login-canary.sh:/canary/login-canary.sh:ro
    depends_on:
      grafana:
        condition: service_healthy

  # ---------------------------------------------------------------- Canary
  # Node + ibmmq (MQI) + OTel SDK. Same image, three roles.
  canary:
    <<: *lab_service
    mem_limit: 512m               # a leak recycles the container (restart policy), never the host
    build: ./canary
    image: mq-obs/canary:local
    environment: &canary_env
      MODE: canary
      MQ_QMGR: ${MQ_QMGR_NAME:-QM1}
      MQ_CONNAME: mq(1414)
      MQ_CHANNEL: DEV.APP.SVRCONN
      MQ_USER: app
      MQ_PASSWORD_FILE: /run/secrets/mqAppPassword
      CANARY_QUEUE: APP.CANARY
      ORDERS_QUEUE: APP.ORDERS.REQ
      INTERVAL_MS: "10000"
      OTEL_SERVICE_NAME: mq-canary
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=ibmmq,deployment.environment=${ENV:-lab},service.version=0.1.0
    secrets:
      - mqAppPassword
    depends_on:
      mq:
        condition: service_healthy

  producer:
    <<: *lab_service
    mem_limit: 512m
    image: mq-obs/canary:local
    pull_policy: never            # image is built by the canary service; never ask a registry
    environment:
      <<: *canary_env
      MODE: producer
      OTEL_SERVICE_NAME: orders-producer
      RATE_PER_SEC: "${PRODUCER_RATE:-5}"
    secrets:
      - mqAppPassword
    depends_on:
      canary:
        condition: service_started

  consumer:
    <<: *lab_service
    mem_limit: 512m
    image: mq-obs/canary:local
    pull_policy: never            # image is built by the canary service; never ask a registry
    environment:
      <<: *canary_env
      MODE: consumer
      OTEL_SERVICE_NAME: orders-consumer
      # The consumer's native heap grows ~1 KB per GET (measured 2026-09-16; ~0.4 KB with the
      # ibmmq module's OTel hook off; reconnecting every 1000 messages released nothing). Until
      # the client library is fixed, mem_limit + restart above bound it: at 5 msg/s the
      # container recycles itself roughly daily instead of exhausting the host.
    secrets:
      - mqAppPassword
    depends_on:
      canary:
        condition: service_started

  # ----------------------------------------------------------------- Kafka
  # A single KRaft node, the live target of Observogram's kafka reference pack (validated like
  # the grafana and prometheus packs: tools/reference-packs.mjs). Prometheus scrapes it directly
  # (stack/prometheus/prometheus.yml, jobs kafka-broker and kafka-exporter, the names the pack's
  # SLIs select on). Not part of the MQ pack: no MQ rule, board or harness check reads it.
  kafka:
    <<: *lab_service
    build:
      context: ./stack/kafka
      args:
        KAFKA_TAG: ${KAFKA_TAG:-3.9.2}
        CURL_TAG: ${CURL_TAG:-8.22.0}
    image: mq-obs/kafka:${KAFKA_TAG:-3.9.2}
    environment:
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://127.0.0.1:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      # Prometheus' JMX exporter as a javaagent: the broker's MBeans on :9404 (stack/kafka/jmx-kafka.yml)
      KAFKA_OPTS: -javaagent:/opt/jmx/jmx_prometheus_javaagent.jar=9404:/opt/jmx/kafka.yml
    volumes:
      - kafkadata:/var/lib/kafka/data
    ports:
      - "127.0.0.1:29092:29092"   # EXTERNAL listener for host clients (kcat, kafka-console-*)
      - "127.0.0.1:29404:9404"    # broker metrics (JMX exporter)
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9092"]   # the client listener accepts
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  # kafka_exporter: topics, partitions, replicas and consumer-group offsets as an admin client.
  kafka-exporter:
    <<: *lab_service
    image: danielqsj/kafka-exporter:${KAFKA_EXPORTER_TAG:-v1.10.0}
    command: ["--kafka.server=kafka:9092", "--web.listen-address=:9308"]
    ports:
      - "127.0.0.1:29308:9308"
    # No compose healthcheck: the image carries only the exporter binary. Prometheus' up{} says.
    depends_on:
      kafka:
        condition: service_healthy

  # Traffic: two topics, a committing consumer group and a steady producer on each (gen.sh).
  kafka-gen:
    <<: *lab_service
    mem_limit: 1g                 # four small JVMs from the broker image's own tools
    build:
      context: ./stack/kafka
      args:
        KAFKA_TAG: ${KAFKA_TAG:-3.9.2}
        CURL_TAG: ${CURL_TAG:-8.22.0}
    image: mq-obs/kafka:${KAFKA_TAG:-3.9.2}
    entrypoint: ["/opt/lab/gen.sh"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_ORDERS_RATE: ${KAFKA_ORDERS_RATE:-50}
      KAFKA_PAYMENTS_RATE: ${KAFKA_PAYMENTS_RATE:-10}
      KAFKA_HEAP_OPTS: -Xmx128m
    depends_on:
      kafka:
        condition: service_healthy

secrets:
  mqAdminPassword:
    file: ./stack/mq/secrets/mqAdminPassword
  mqAppPassword:
    file: ./stack/mq/secrets/mqAppPassword

volumes:
  qmdata:
  promdata:
  lokidata:
  tempodata:
  otelcol-state:
  grafana-data:
  kafkadata:
