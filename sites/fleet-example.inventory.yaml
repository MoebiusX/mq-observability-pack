# A fleet example with two environments in one file (prod and staging). Files merge, so one
# inventory per environment is equally valid: `--inventory prod.yaml --inventory staging.yaml`.
# Environment inheritance: file `env` -> host `env` -> queue manager `env` (a queue manager
# without `env` takes the unique environment of its hosts). Secrets are references, never values.
# CI renders every environment (`npm run site:check`) and gates the output statically.
inventory: v1
pack: packs/ibmmq.pack.yaml
environments:
  prod:
    scrape_interval: 30s            # else spec.environments.prod.overrides['prometheus.scrape_interval'], else the pack step
    vantage: dual                   # native endpoint (MQ SERVICE local exporter) + client exporter: the certified rule set
    profile: non-container          # native counters are not `_total`: delta estimator instead of rate()
    endpoints:
      remote_write: https://mimir.prod.internal/api/v1/push
      loki: https://loki.prod.internal/otlp
      tempo: tempo.prod.internal:4317
      alertmanager: https://am.prod.internal
      alert_sink: http://alert-sink.mq-obs.svc:9095
      otlp: http://otel-gateway.mq-obs.svc:4318
      grafana: https://grafana.prod.internal
    receivers: { sev1: pagerduty://mq, sev2: '#mq-oncall', sev3: '#mq-team' }
    secrets:
      pagerduty://mq: /etc/alertmanager/secrets/pagerduty_mq
      '#mq-oncall': /etc/alertmanager/secrets/msteams_mq_oncall
      '#mq-team': /etc/alertmanager/secrets/msteams_mq_team
    repo_url: https://github.com/MoebiusX/mq-observability-pack/blob/main
    params:
      app_queue_pattern: 'ORD\..*|PAY\..*'
      monitored_queues: [ 'ORD.*', 'PAY.*' ]
      deadq: SYSTEM.DEAD.LETTER.QUEUE
      canary_queue: MON.CANARY
      orders_queue: null
      listener: SYSTEM.LISTENER.TCP.1
      users: { monitor: mqmon, canary: mqcanary }
      monitoring_hosts: '10.20.1-40.*'
      monitoring_host: mon1.prod.internal
      exporter_poll_interval: 30s
      canary_interval: 30s
      log_source: amqerr-json
  staging:
    vantage: single                 # client exporter only today: the degraded alert set (Silent/Restarted instead of Down)
    profile: non-container
    endpoints:
      remote_write: https://mimir.stg.internal/api/v1/push
      loki: https://loki.stg.internal/otlp
      tempo: tempo.stg.internal:4317
      alertmanager: https://am.stg.internal
      alert_sink: http://alert-sink.mq-obs-stg.svc:9095
      otlp: http://otel-gateway.mq-obs-stg.svc:4318
    receivers: { sev1: '#mq-team', sev2: '#mq-team', sev3: '#mq-team' }
    secrets:
      '#mq-team': /etc/alertmanager/secrets/msteams_mq_team
    params:
      app_queue_pattern: 'ORD\..*'
      monitored_queues: [ 'ORD.*' ]
      deadq: SYSTEM.DEAD.LETTER.QUEUE
      canary_queue: MON.CANARY
      orders_queue: null
      users: { monitor: mqmon, canary: mqcanary }
      monitoring_hosts: '10.30.*'
      monitoring_host: mon1.stg.internal
      log_source: amqerr-json
hosts:
  - { name: mqha1.prod.internal, env: prod, site: dc1, roles: [rdqm-ha] }
  - { name: mqha2.prod.internal, env: prod, site: dc1, roles: [rdqm-ha] }
  - { name: mqha3.prod.internal, env: prod, site: dc1, roles: [rdqm-ha] }
  - { name: mqpay1.prod.internal, env: prod, site: dc2, roles: [standalone] }
  - { name: mqord1.stg.internal, env: staging, site: dc1, roles: [standalone] }
queue_managers:
  - name: QMORD1
    shape: rdqm-ha                  # env inherited from its hosts (all prod)
    hosts: [ mqha1.prod.internal, mqha2.prod.internal, mqha3.prod.internal ]
    address: { host: 10.20.5.11, port: 1414 }   # rdqmint floating IP: clients, the client exporter and the native scrape follow the primary
    params:
      native_port: 9157
      client_port: 9161
      channels: { monitoring: MON.SVRCONN, canary: CANARY.SVRCONN, define: true }
      tls: { ccdt_url: file:///etc/mq/ccdt/QMORD1.json, key_repository: /etc/mq/tls/mqmon, cipher: ANY_TLS12_OR_HIGHER, sslcauth: REQUIRED }
      credentials: { monitor_secret: /run/secrets/mqmon-QMORD1, canary_secret: /run/secrets/mqcanary-QMORD1 }
      rdqm: { group: ord, dr: false }
  - name: QMPAY1
    shape: host
    hosts: [ mqpay1.prod.internal ]
    address: { host: mqpay1.prod.internal, port: 1415 }
    params:
      native_port: 9157
      client_port: 9162
      channels: { monitoring: MON.SVRCONN, canary: CANARY.SVRCONN, define: true }
      tls: { ccdt_url: file:///etc/mq/ccdt/QMPAY1.json, key_repository: /etc/mq/tls/mqmon, cipher: ANY_TLS12_OR_HIGHER }
      credentials: { monitor_secret: /run/secrets/mqmon-QMPAY1, canary_secret: /run/secrets/mqcanary-QMPAY1 }
  - name: QMORDS
    env: staging
    shape: host
    hosts: [ mqord1.stg.internal ]
    address: { host: mqord1.stg.internal, port: 1414 }
    params:
      client_port: 9161
      channels: { monitoring: MON.SVRCONN, canary: CANARY.SVRCONN, define: true }
      tls: { ccdt_url: file:///etc/mq/ccdt/QMORDS.json, key_repository: /etc/mq/tls/mqmon, cipher: ANY_TLS12_OR_HIGHER }
      credentials: { monitor_secret: /run/secrets/mqmon-QMORDS, canary_secret: /run/secrets/mqcanary-QMORDS }
